name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-team.txt
      - name: No data in the repo, official files untouched
        run: python tools/check_repo.py
      - name: Tests (synthetic data only)
        run: python -m pytest -q
